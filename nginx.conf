server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;

    # Photos encodées en base64 : jusqu'à 5 Mo par image
    client_max_body_size 15m;

    # Sonde de santé du frontend (Kubernetes : liveness / readiness)
    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok";
    }

    # API FastAPI : adresse fournie par la variable BACKEND_URL
    location /api/ {
        proxy_pass ${BACKEND_URL};
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Fichiers compilés (nom haché) : cache long
    location ~* \.(?:js|css|ico|woff2?)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # Application Angular : toutes les routes renvoient index.html (sans cache)
    location / {
        add_header Cache-Control "no-cache";
        try_files $uri $uri/ /index.html;
    }
}
