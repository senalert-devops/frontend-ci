name: frontend-ci

on:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      # 1. Récupérer le code du dépôt
      - name: Récupérer le code
        uses: actions/checkout@v4

      # 2. Se connecter à Docker Hub 
      - name: Connexion Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ vars.DOCKERHUB_USER }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      # 3. Fabriquer l'image et l'envoyer sur Docker Hub
      - name: Construire et envoyer l'image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ vars.DOCKERHUB_USER }}/senalert-frontend:latest
